name: Docs Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  links-and-json:
    name: Links + JSON fences + PyPI names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check links and JSON fences
        run: |
          python3 tools/check_docs.py links
          python3 tools/check_docs.py json

      # Plugin IDs, repository names and pip distribution names are three
      # different things in this ecosystem, and the docs have shipped
      # `pip install <plugin-id>` commands that 404. Every lookup that cannot
      # reach PyPI is skipped, so a network outage cannot fail the build.
      - name: Check documented pip packages exist on PyPI
        run: python3 tools/check_docs.py packages

  strict-build:
    name: Strict mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install mkdocs
        run: |
          pip install \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.31 \
            pymdown-extensions==10.11.2 \
            mkdocs-material-extensions==1.3.1 \
            mkdocs-get-deps==0.2.2 \
            pygments==2.18.0 \
            mkdocs-redirects==1.2.2

      # Build.yml deploys without --strict, so a nav entry pointing at a file
      # that does not exist, or a broken in-page anchor, would only show up on
      # the published site. Catch it on the pull request instead.
      - name: Build with --strict
        run: mkdocs build --strict

  python-imports-and-signatures:
    name: Python imports + signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/ci-requirements.txt

      - name: Install a minimal OVOS stack (alpha channel)
        env:
          PIP_CONSTRAINT: https://raw.githubusercontent.com/OpenVoiceOS/ovos-releases/refs/heads/main/constraints-alpha.txt
        run: |
          python3 -m pip install --upgrade pip
          pip install --pre -r tools/ci-requirements.txt

      - name: Check python imports and signatures
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python3 tools/check_docs.py python-imports
          python3 tools/check_docs.py signatures
